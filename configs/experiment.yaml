model:
  name: Qwen/Qwen2.5-1.5B-Instruct

dataset:
  name: mandarjoshi/trivia_qa
  config: rc.nocontext
  split: validation

experiment:
  n_questions: 500
  seed: 42
  max_new_tokens: 16
  n_samples: 5
  sampling_temperature: 0.7
  n_bins: 10
  calibration_split_ratio: 0.5
  temperature_max_iter: 100
  n_bootstrap: 1000

outputs:
  questions: results/questions.jsonl
  generations: results/generations.jsonl
  confidence: results/confidence.csv
  evaluated_predictions: results/evaluated_predictions.csv
  metrics: results/metrics.json
  figures_dir: results/figures
